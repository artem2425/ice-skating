{% extends 'base.html' %}{% block title %}Сеансы{% endblock %}{% block content %}<h1>Сеансы катка</h1><form method="get" class="filters"><label>Минимум посетителей<input type="number" name="skaters" min="0" value="{{ skaters }}" placeholder="Например, 50"></label><label>Сортировка<select name="sort"><option value="date_asc" {% if sort == 'date_asc' %}selected{% endif %}>Дата: сначала ранние</option><option value="date_desc" {% if sort == 'date_desc' %}selected{% endif %}>Дата: сначала поздние</option><option value="skaters_asc" {% if sort == 'skaters_asc' %}selected{% endif %}>Посетители: по возрастанию</option><option value="skaters_desc" {% if sort == 'skaters_desc' %}selected{% endif %}>Посетители: по убыванию</option></select></label><label>Количество<select name="limit"><option value="" {% if not limit %}selected{% endif %}>Все</option><option value="3" {% if limit == '3' %}selected{% endif %}>3</option><option value="5" {% if limit == '5' %}selected{% endif %}>5</option><option value="10" {% if limit == '10' %}selected{% endif %}>10</option></select></label><button class="btn" type="submit">Применить</button></form><div class="cards">{% for session in sessions %}{% include 'skating/includes/skate_card.html' %}{% empty %}<p class="empty">По выбранным условиям сеансы не найдены.</p>{% endfor %}</div>{% endblock %}
